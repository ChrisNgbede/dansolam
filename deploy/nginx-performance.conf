# Include inside the site's `server { ... }` block (nginx equivalent of public/.htaccess).

gzip on;
gzip_comp_level 6;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# Serve "<name>.avif" instead of "<name>.webp" when the browser accepts AVIF.
map $http_accept $avif_suffix {
    default        "";
    "~*image/avif" ".avif";
}
# NOTE: `map` must live in the http{} context; move the block above there if nginx complains.

location ~* ^/(storage|images)/(.+)\.webp$ {
    add_header Vary Accept;
    add_header Cache-Control "public, max-age=2592000";
    try_files /$1/$2$avif_suffix /$1/$2.webp =404;
}

# Vite output is content-hashed: cache forever.
location ^~ /build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location ~* \.(?:avif|webp|svg|png|jpe?g|woff2)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}
